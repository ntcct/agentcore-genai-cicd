name: infra

# Terraform pipeline: runs only when infrastructure code changes.
on:
  pull_request:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "apply = create/update infra, destroy = tear down infra/ resources"
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  id-token: write       # GitHub OIDC -> AWS STS
  contents: read
  pull-requests: write  # plan comment

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: 1.16.5

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency: { group: terraform-plan-${{ github.ref }}, cancel-in-progress: true }
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Seed zip is only used when the runtime is first created
      - name: Package seed zip
        working-directory: .
        run: python scripts/package.py
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"
      - name: terraform validate
        run: terraform validate
      - name: terraform plan
        run: |
          terraform plan -lock-timeout=5m -out=tfplan
          terraform show -no-color tfplan > plan.txt
      - name: Comment plan on PR
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          {
            echo "### Terraform plan (infra)"
            echo '<details><summary>Show plan</summary>'
            echo
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

  apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production          # required reviewer = manual approval gate
    concurrency: { group: agentcore-runtime, cancel-in-progress: false }  # shared with app deploys
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Package seed zip
        working-directory: .
        run: python scripts/package.py
      - name: terraform init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"
      - name: terraform plan
        run: |
          DESTROY_FLAG=""
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then DESTROY_FLAG="-destroy"; fi
          terraform plan $DESTROY_FLAG -lock-timeout=5m -out=tfplan
      - name: terraform apply
        run: terraform apply -lock-timeout=5m -auto-approve tfplan
      - name: Show outputs (copy into repo variables if they changed)
        if: github.event.inputs.action != 'destroy'
        run: terraform output

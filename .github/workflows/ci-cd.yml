name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "apply = deploy, destroy = tear down infra/ resources"
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  id-token: write       # GitHub OIDC -> AWS STS (no stored AWS keys)
  contents: read
  pull-requests: write  # post plan as PR comment

# One Terraform run at a time against the shared state
concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: 1.16.5

jobs:
  # ---------------- PR: build + validate + plan, comment plan on PR ----------------
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Lint Python
        working-directory: .
        run: python -m py_compile app/main.py scripts/package.py
      - name: Package agent (ARM64 zip)
        working-directory: .
        run: python scripts/package.py
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"
      - name: terraform validate
        run: terraform validate
      - name: terraform plan
        run: |
          terraform plan -lock-timeout=5m -out=tfplan
          terraform show -no-color tfplan > plan.txt
      - name: Comment plan on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Terraform plan"
            echo '<details><summary>Show plan</summary>'
            echo
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

  # ---------------- main / manual: plan + apply (or destroy) + smoke test ----------------
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production   # add "Required reviewers" here for a manual approval gate
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Package agent (ARM64 zip)
        working-directory: .
        run: python scripts/package.py
      - name: terraform init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"
      - name: terraform plan
        run: |
          DESTROY_FLAG=""
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then DESTROY_FLAG="-destroy"; fi
          terraform plan $DESTROY_FLAG -lock-timeout=5m -out=tfplan
      - name: terraform apply
        run: terraform apply -lock-timeout=5m -auto-approve tfplan

      - name: Wait for runtime READY
        if: github.event.inputs.action != 'destroy'
        run: |
          RUNTIME_ID=$(terraform output -raw agent_runtime_id)
          for i in $(seq 1 30); do
            STATUS=$(aws bedrock-agentcore-control get-agent-runtime --agent-runtime-id "$RUNTIME_ID" --query status --output text)
            echo "status=$STATUS"
            [ "$STATUS" = "READY" ] && exit 0
            case "$STATUS" in *FAILED*) exit 1;; esac
            sleep 10
          done
          exit 1

      - name: Smoke test (invoke agent)
        if: github.event.inputs.action != 'destroy'
        run: |
          ARN=$(terraform output -raw agent_runtime_arn)
          SESSION_ID="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)-smoke-test-session"
          aws bedrock-agentcore invoke-agent-runtime \
            --agent-runtime-arn "$ARN" \
            --qualifier DEFAULT \
            --runtime-session-id "$SESSION_ID" \
            --content-type application/json \
            --cli-binary-format raw-in-base64-out \
            --payload '{"prompt":"In one sentence, what is Amazon Bedrock AgentCore?"}' \
            response.json
          cat response.json
          grep -q '"result"' response.json
          # Release the session immediately so it stops accruing memory charges
          aws bedrock-agentcore stop-runtime-session \
            --agent-runtime-arn "$ARN" --qualifier DEFAULT \
            --runtime-session-id "$SESSION_ID" || true
